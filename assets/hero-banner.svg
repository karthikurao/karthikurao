<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font: 800 46px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; fill: #F8FAFC; letter-spacing: -0.5px; }
    .subtitle { font: 600 16px 'JetBrains Mono', 'Fira Code', monospace; fill: #38BDF8; letter-spacing: 1.5px; }
    .code { font: 500 13px 'JetBrains Mono', 'Fira Code', monospace; fill: #94A3B8; }
    .code-hi { fill: #C084FC; }
    .code-str { fill: #34D399; }
    .pulse-ring {
      transform-origin: 90px 52px;
      animation: pulse 2.4s infinite ease-out;
    }
    .flow-line {
      stroke-dasharray: 12 8;
      animation: dash 18s linear infinite;
    }
    .float-card {
      animation: float 5s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { r: 5px; opacity: 0.9; }
      100% { r: 16px; opacity: 0; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -360; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
  </style>

  <!-- Background & Grid -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="280" rx="16" fill="url(#grid)" />

  <!-- Decorative Animated Circuit Traces -->
  <path class="flow-line" d="M 650 240 L 820 240 L 870 190 L 1160 190" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.45" />
  <path class="flow-line" d="M 720 40 L 890 40 L 930 80 L 1160 80" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Top Status Pill -->
  <rect x="70" y="36" width="235" height="32" rx="16" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <circle class="pulse-ring" cx="90" cy="52" r="5" fill="none" stroke="#34D399" stroke-width="2" />
  <circle cx="90" cy="52" r="5" fill="#34D399" />
  <text x="108" y="57" class="code" style="fill: #E2E8F0; font-weight: 600;">SYSTEMS ONLINE // BLR</text>

  <!-- Main Identity -->
  <text x="70" y="132" class="title">KARTHIK U RAO</text>
  <text x="70" y="168" class="subtitle">SOFTWARE ENGINEER • BACKEND ARCHITECTURE • APPLIED AI</text>
  <rect x="70" y="188" width="440" height="3" rx="1.5" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Bottom Tagline -->
  <text x="70" y="230" class="code">
    <tspan class="code-hi">stack:</tspan> [.NET, Java, Spring Boot, Python, React, TypeScript, Docker]
  </text>

  <!-- Right Floating Telemetry Terminal Card -->
  <g class="float-card">
    <rect x="740" y="52" width="390" height="176" rx="12" fill="#090D16" fill-opacity="0.88" stroke="#334155" stroke-width="1.5" />
    <!-- Window Controls -->
    <circle cx="764" cy="74" r="5" fill="#EF4444" />
    <circle cx="782" cy="74" r="5" fill="#F59E0B" />
    <circle cx="800" cy="74" r="5" fill="#10B981" />
    <text x="822" y="78" class="code" style="font-size: 11px; fill: #64748B;">karthik@arch-node: ~/telemetry</text>
    <line x1="740" y1="90" x2="1130" y2="90" stroke="#1E293B" stroke-width="1" />

    <!-- Terminal Lines -->
    <text x="762" y="118" class="code"><tspan class="code-hi">$</tspan> ./inspect-engineering-profile.sh</text>
    <text x="762" y="144" class="code">▸ focus      : <tspan class="code-str">"Scalable APIs &amp; Full-Stack"</tspan></text>
    <text x="762" y="168" class="code">▸ flagship   : <tspan class="code-str">["Snapory", "LinkShield-AI"]</tspan></text>
    <text x="762" y="192" class="code">▸ heuristic  : <tspan style="fill: #38BDF8; font-weight: 700;">ship &gt; overthink</tspan></text>
  </g>
</svg>
