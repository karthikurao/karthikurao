    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.6070;0.6090;0.7490;1" values="0;0;0.9;0;0"/>
  </circle>
  <circle cx="1120" cy="265" r="8" fill="none" stroke="#8ab4ff" stroke-width="1.5" opacity="0">
    <animate attributeName="r" dur="7s" repeatCount="indefinite" keyTimes="0;0.7780;0.7800;0.9200;1" values="8;8;8;26;26"/>
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.7780;0.7800;0.9200;1" values="0;0;0.9;0;0"/>
