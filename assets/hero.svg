<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Karthik Rao, backend-first engineer in Bengaluru">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="clip"><rect width="1200" height="380" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="#0e1116"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- corner marks -->
    <g fill="none" stroke="#3a424d" stroke-width="1.2">
      <path d="M24 44V24H44"/><path d="M1176 44V24H1156"/>
      <path d="M24 336V356H44"/><path d="M1176 336V356H1156"/>
    </g>

    <text x="64" y="58" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="2.5" fill="#6b7480">BENGALURU  12.97N  77.59E</text>

    <!-- request status, top right -->
    <text x="1136" y="58" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1" fill="#9aa3ad" opacity="0">GET /karthik
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.02;0.76;0.80;1" values="0;1;1;0;0"/>
    </text>
    <text x="1136" y="58" text-anchor="end" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1" fill="#8ab4ff" opacity="0">200 OK
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.78;0.82;0.96;1" values="0;0;1;1;0"/>
    </text>

    <!-- name -->
    <text x="62" y="185" font-family="Georgia,'Times New Roman','DejaVu Serif',serif" font-size="98" fill="#f2efe8" letter-spacing="-1">Karthik
      <animate attributeName="opacity" dur="0.9s" begin="0s" fill="freeze" values="0;1"/>
    </text>
    <text x="62" y="282" font-family="Georgia,'Times New Roman','DejaVu Serif',serif" font-size="98" fill="#f2efe8" letter-spacing="-1">Rao<tspan fill="#8ab4ff">.</tspan>
      <animate attributeName="opacity" dur="1.3s" begin="0s" fill="freeze" keyTimes="0;0.3;1" values="0;0;1"/>
    </text>
    <text x="66" y="331" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="1" fill="#9aa3ad">backend-first  /  c#  java  react
      <animate attributeName="opacity" dur="1.8s" begin="0s" fill="freeze" keyTimes="0;0.55;1" values="0;0;1"/>
    </text>

    <!-- architecture -->
  <circle cx="700" cy="95" r="2.5" fill="#3a424d"/>
  <circle cx="830" cy="322" r="2.5" fill="#3a424d"/>
  <circle cx="985" cy="335" r="2.5" fill="#3a424d"/>
