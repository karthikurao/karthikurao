  <text x="775" y="153" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#6b7480">api</text>
  <text x="905" y="287" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#6b7480">service</text>
  <text x="1025" y="153" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#6b7480">queue</text>
  <text x="1120" y="297" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.5" fill="#6b7480">store</text>

    <!-- the request -->
    <g opacity="0">
      <animateMotion dur="7s" repeatCount="indefinite" path="M650 265 L775 175 L905 255 L1025 175 L1120 265" keyPoints="0;0;1;1" keyTimes="0;0.02;0.78;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.02;0.76;0.80;1" values="0;1;1;0;0"/>
      <circle r="11" fill="#ffb86b" opacity="0.45" filter="url(#glow)"/>
      <circle r="4.5" fill="#ffb86b"/>
